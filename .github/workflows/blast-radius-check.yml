name: SDSD Blast-Radius Boundary Check

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

jobs:
  check-blast-radius:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Untouchable Baseline Files
        run: |
          echo "=== SDSD BLAST-RADIUS GUARDRAIL ==="
          
          # List of strictly untouchable paths
          FORBIDDEN_PATTERNS=(
            "^src/auth/"
            "^schema/migrations/"
            "^config/production\."
            "^\.github/workflows/spec-drift-check\.yml"
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          else
            DIFF_TARGET="HEAD~1..HEAD"
          fi
          CHANGED_FILES=$(git diff --name-only $DIFF_TARGET 2>/dev/null || true)
          VIOLATIONS=()

          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(echo "$CHANGED_FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              for file in $MATCHES; do
                VIOLATIONS+=("$file (matches forbidden boundary '$pattern')")
              done
            fi
          done

          if [ ${#VIOLATIONS[@]} -gt 0 ]; then
            echo "❌ BLAST-RADIUS INVARIANT VIOLATION DETECTED!"
            echo "The following untouchable baseline files were modified:"
            for v in "${VIOLATIONS[@]}"; do
              echo "  - $v"
            done
            echo "Autonomous agents are strictly forbidden from modifying baseline infrastructure or authentication without formal architecture sign-off."
            exit 1
          fi

          echo "✅ Blast-radius verification passed: No untouchable files were modified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SDSD Specification Linter & Tests
        run: |
          python tools/sdsd_validate.py --all
          python -m unittest discover tests
